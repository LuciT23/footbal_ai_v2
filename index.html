<!DOCTYPE html> 
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football AI v2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <header class="navbar">
        <h1>⚽ Football AI v2</h1>
        <div class="stats-summary">
            <span>Liga selectată: <strong id="current-league">Toate</strong></span>
        </div>
    </header>

    <main class="container">
        <!-- Secțiunea de Filtre -->
        <section class="filters">
            <label for="league-select">Alege Liga:</label>
            <select id="league-select">
                <option value="all">Toate Ligile</option>
                <option value="premier-league">Premier League</option>
                <option value="la-liga">La Liga</option>
                <option value="serie-a">Serie A</option>
            </select>
        </section>

        <!-- Tabel Meciuri și Predicții -->
        <section class="matches-container">
            <table>
                <thead>
                    <tr>
                        <th>Data / Ora</th>
                        <th>Meci</th>                
                        <th>Predicție AI</th>
                        <th>Incredere</th>
                    </tr>
                </thead>
                <tbody id="matches-table-body">
                    <!-- Meciurile vor fi generate automat din JavaScript -->
                    <tr>
                        <td colspan="7" style="text-align: center;">Se încarcă datele...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
